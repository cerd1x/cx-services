"""
Operasi lintas-user. Hanya untuk user dengan `role: admin` — field di bawah
ditandai `@admin`, bukan `@authorized`, sehingga user biasa mendapat 403 dan
tanpa token mendapat 401.
"""
type Query {
  me: MeUser!
  checkAuthorized: Boolean!
  passkeyRegistrationOptions: PasskeyRegistrationOptionsPayload!
  passkeyAuthenticationOptions: PasskeyAuthenticationOptionsPayload!
  passkeys: [PasskeyInfo!]!
  assets: [Asset!]!
  asset(name: String!): Asset
  assetById(id: ID!): Asset
  assetMutations(assetId: ID!): [AssetMutationType!]!
  user(username: String!): User
  users: [User!]!
  product(id: String!): Product
  products: [Product!]!
  contact(id: String!): Contact
  contacts: [Contact!]!
  contactConnection(first: Int, after: String, last: Int, before: String): ContactConnection!
  transaction(id: String!): Transaction
  transactions: [Transaction!]!
  transactionConnection(first: Int, after: String, last: Int, before: String): TransactionConnection!
  transactionsByType(type: TransactionType!): [Transaction!]!
  transactionsByDateRange(start: DateTime!, end: DateTime!): [Transaction!]!
  setting: Setting!
  statistics: Statistic!
  order(id: String!): Order
  orders: [Order!]!
  payment(id: ID!): Payment
  payments: [Payment!]!
  paymentsByStatus(status: PaymentStatusEnum!): [Payment!]!
  invoice(id: ID!): Invoice
  invoices: [Invoice!]!
  invoicesByStatus(status: InvoiceStatusEnum!): [Invoice!]!
  adminUsers: [AdminUser!]!
  adminOverview: AdminOverview!
  adminUserTransactions(userId: ID!, limit: Int): [AdminTransaction!]!
}

type MeUser {
  id: ID!
  username: String!
  name: String!
  avatarUrl: String
}

type PasskeyRegistrationOptionsPayload {
  options: String!
  challenge: String!
}

type PasskeyAuthenticationOptionsPayload {
  options: String!
  challenge: String!
}

type PasskeyInfo {
  id: String!
  deviceName: String
  createdAt: DateTime!
}

type Mutation {
  signUp(input: SignUpInput!): SignUpPayload!
  signIn(input: SignInInput!): SignInPayload!
  signInWithPassKey(input: SignInWithPassKeyInput!): SignInPayload!
  signOut: Boolean!
  registerPasskey(input: RegisterPasskeyInput!): Boolean!
  deletePasskey(credentialId: String!): Boolean!
  createAsset(input: CreateAssetInput!): Asset!
  updateAsset(id: ID!, input: AssetInputUpdate!): Asset!
  deleteAsset(name: String!): Boolean!
  addBalance(assetId: ID!, amount: Money!): Asset!
  subtractBalance(assetId: ID!, amount: Money!): Asset!
  createUser(input: CreateUserInput!): User!
  updateUserAvatar(input: UpdateUserAvatarInput!): User!
  createProduct(input: CreateProductInput!): Product!
  updateProduct(id: String!, input: UpdateProductInput!): Product!
  deleteProduct(id: String!): Boolean!
  importProductFromCSV(content: String!, filename: String!): ImportProductResult!
  createContact(input: CreateContactInput!): Contact!
  updateContact(id: String!, input: UpdateContactInput!): Contact!
  deleteContact(id: String!): Boolean!
  importContacts(content: String!, filename: String!): ImportResult!
  mergeContacts(phone: String!): MergeResult!
  createTransaction(input: CreateTransactionInput!): Transaction!
  updateTransaction(id: ID!, input: UpdateTransactionInput!): Transaction!
  deleteTransaction(id: ID!): Boolean!
  swapBalance(fromAssetId: ID!, toAssetId: ID!, amount: Money!): SwapBalanceResult!
  updateSetting(input: UpdateSettingInput!): Setting!
  createOrder(input: CreateOrderInput!): Order!
  updateOrder(id: String!, input: UpdateOrderInput!): Order!
  deleteOrder(id: String!): Boolean!
  createOrderProductSale(input: CreateOrderProductSaleInput!): Order!
  createOrderExpense(input: CreateOrderExpenseInput!): Order!
  createOrderLoan(input: CreateOrderLoanInput!): Order!
  processPayment(input: ProcessPaymentInput!): Payment!
  retryPayment(paymentId: ID!): Payment!
  createInvoice(input: CreateInvoiceInput!): Invoice!
  issueInvoice(id: ID!): Invoice!
  cancelInvoice(id: ID!): Invoice!
  adminSetUserRole(input: AdminSetUserRoleInput!): User!
  adminDeleteUser(userId: ID!): Boolean!
}

