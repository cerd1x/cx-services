"""
User yang dilihat admin. Sengaja tidak memuat `password`, dan `email` hanya
ada di sini — bukan di type `User` biasa.
"""
type AdminUser {
  id: ID!
  name: String!
  username: String!
  email: String!
  role: UserRole!
  avatarUrl: String
  createdAt: DateTime!
}

type AdminOverview {
  totalUsers: Int!
  totalAdmins: Int!
  totalTransactions: Int!
  totalAssets: Int!

  """
  Total `amount` untuk transaksi bertipe income, dijumlahkan apa adanya.
  Nilainya belum dinormalisasi ke satu mata uang.
  """
  totalIncome: Float!

  """
  Total `amount` untuk transaksi bertipe expense, dijumlahkan apa adanya.
  """
  totalExpense: Float!
}

type AdminTransaction {
  id: ID!
  userId: ID!
  type: String!
  status: String!
  paymentStatus: String!
  amount: Float!
  capital: Float!
  description: String
  category: String
  date: String!
  createdAt: DateTime!
}