type Query {
  order(id: String!): Order @authorized
  orders: [Order!]! @authorized
}

type Mutation {
  createOrder(input: CreateOrderInput!): Order! @authorized
  updateOrder(id: String!, input: UpdateOrderInput!): Order! @authorized
  deleteOrder(id: String!): Boolean! @authorized
  createOrderProductSale(input: CreateOrderProductSaleInput!): Order! @authorized
  createOrderExpense(input: CreateOrderExpenseInput!): Order! @authorized
  createOrderLoan(input: CreateOrderLoanInput!): Order! @authorized
}

input CreateOrderProductSaleInput {
  productId: ID!
  itemCount: Int!
  price: Money!
  paymentMethod: PaymentMethodType
  customerId: ID
  description: String
  payWithAssetId: ID
  paymentStatus: TransactionPaymentStatus
}

input CreateOrderExpenseInput {
  price: Money!
  itemCount: Int!
  description: String
  customerId: String
  paymentMethod: PaymentMethodType
  payWithAssetId: ID
}

input CreateOrderInput {
  price: Money!
  itemCount: Int!
  paymentMethod: PaymentMethodType
  description: String
  customerId: String
}

input CreateOrderLoanInput {
  price: Money!
  itemCount: Int!
  paymentMethod: PaymentMethodType
  customerId: ID
  description: String
  payWithAssetId: ID
  paymentStatus: TransactionPaymentStatus
}

input UpdateOrderInput {
  status: String
  paymentMethod: PaymentMethodType
  description: String
  customerId: String
}

type Order {
  id: ID
  userId: ID
  status: String!
  paymentMethod: PaymentMethodType!
  price: Money!
  itemCount: Int!
  description: String
  customerId: ID
  createdAt: DateTime
  updatedAt: DateTime
}
