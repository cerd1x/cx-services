type Query {
  assets: [Asset!]! @authorized
  asset(name: String!): Asset @authorized
  assetById(id: ID!): Asset @authorized
  assetMutations(assetId: ID!): [AssetMutationType!]! @authorized
}

type Mutation {
  createAsset(input: CreateAssetInput!): Asset! @authorized
  updateAsset(id: ID!, input: AssetInputUpdate!): Asset! @authorized
  deleteAsset(name: String!): Boolean! @authorized
  mutateAsset(input: MutateAssetInput!): MutateAssetResult! @authorized
}

input CreateAssetInput {
  name: String!
  type: AssetType!
  ## format ISO CODE + VAlUE
  # example:
  #   balance = "IDR 20.000" or
  #   balance = "IDR 20000"
  balance: Money!
}

input AssetInputUpdate {
  name: String
  type: AssetType
  ## format ISO CODE + VAlUE
  balance: Money
  currency: String
}

enum AssetType {
  bank
  ewallet
  cash
  crypto
  loan
}

type Asset {
  id: ID!
  name: String!
  type: AssetType!
  balance: Money!
}

type AssetMutationType {
  id: ID!
  type: String!
  amount: Float!
  currency: String!
  balanceBefore: Money!
  balanceAfter: Money!
  description: String
  createdAt: String!
}

input MutateAssetInput {
  code: String!
  assetId: ID
  fromAssetId: ID
  toAssetId: ID
  amount: Money!
  description: String
}

union MutateAssetResult = AssetSingleMutationResult | AssetTransferResult

type AssetSingleMutationResult {
  code: String!
  asset: Asset!
}

type AssetTransferResult {
  code: String!
  from: Asset!
  to: Asset!
}
